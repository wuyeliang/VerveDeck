# VerveDeck 大模型微调训练推理平台 - 容器编排
# 数据根目录: /data (models/datasets/jobs/gpu/argilla/postgres/redis/uploads)
name: fintune

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintune
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintune123}
      POSTGRES_DB: fintune
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintune"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [fintune]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /data/redis:/data
    networks: [fintune]

  # argilla 2.x 强制要求搜索引擎，单节点 opensearch 关闭安全插件
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - /data/opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [fintune]

  argilla:
    # 官方镜像（argilla-server 2.8.0，与自构版同版本同 CLI）；镜像内以 argilla 用户
    # (uid=1000) 运行，宿主机数据目录须 chown 1000:1000 /data/argilla
    image: argilla/argilla-server:v2.8.0
    restart: unless-stopped
    # argilla-server 2.8.0: 数据库由 ARGILLA_ 前缀环境变量配置；
    # 启动前跑迁移并预建服务账号（2.x 改为 DB 级 API key 认证）
    command: >
      bash -c "python -m argilla_server database migrate &&
      (python -m argilla_server database users create
      --username fintune --first-name Fintune --last-name Service
      --role admin --password fintune123456
      --api-key ${ARGILLA_API_KEY:-fintune-argilla-key} --workspace argilla || true) &&
      python -m argilla_server start --host 0.0.0.0 --port 3000"
    # argilla 2.x settings 带 env_prefix=ARGILLA_，环境变量必须加前缀
    environment:
      ARGILLA_API_KEY: ${ARGILLA_API_KEY:-fintune-argilla-key}
      ARGILLA_DATABASE_URL: sqlite+aiosqlite:////data/argilla/argilla.db?check_same_thread=False
      ARGILLA_SEARCH_ENGINE: opensearch
      ARGILLA_ELASTICSEARCH: http://opensearch:9200
      ARGILLA_ELASTICSEARCH_SSL_VERIFY: "false"
      ARGILLA_REDIS_URL: redis://redis:6379
    volumes:
      - /data/argilla:/data/argilla
    ports:
      - "127.0.0.1:3002:3000"    # 仅本机：web（host 网络）经此转发 /argilla/（3002 避让 grafana 3000）
    depends_on:
      opensearch:
        condition: service_healthy
    networks: [fintune]

  # ---- 对象存储（rustfs，S3 兼容）：数据集版本文件的主存储 ----
  # 非 root 用户（UID 10001），数据目录须用命名卷；S3 API :9000 + 管理控制台 :9001
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API 仅本机（宿主机 mc/客户端）；公网部署严禁暴露（弱口令=数据泄露）
      - "127.0.0.1:9001:9001"   # Web 管理控制台仅本机
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [fintune]

  # ---- JuiceFS（POSIX 分布式文件系统）：数据集/模型可选存储位置（存储管理 → juicefs 类型）
  # 元数据用 redis DB1（与 argilla 的 DB0 隔离）；数据块存 rustfs 的 juicefs 桶
  # （需先建桶：docker run --rm --network fintune_net minio/mc sh -c
  #   "mc alias set rs http://rustfs:9000 $RUSTFS_ACCESS_KEY $RUSTFS_SECRET_KEY && mc mb -p rs/juicefs"）。
  # FUSE 挂载宿主 /data/juicefs。注意：容器 /data 的 rprivate bind 不传播宿主子挂载
  # （实测 FUSE 挂载点在容器内为不可见的空目录），故 backend 服务显式同路径 bind
  # /data/juicefs，worker 容器由 taskcontainer._storage_extra_paths() 动态补挂；
  # format 幂等（已格式化不重做）；升级镜像时挂载短暂卸载数秒。
  # 需 apparmor:unconfined：docker-default profile enforce 下 fusermount3 报
  # Permission denied（dmesg 无 DENIED 记录），unconfined 后挂载成功（实测）。
  juicefs:
    image: juicedata/mount:ce
    restart: unless-stopped
    command: >
      sh -c "juicefs format --storage s3 --bucket http://rustfs:9000/juicefs
      --access-key ${RUSTFS_ACCESS_KEY:-rustfsadmin} --secret-key ${RUSTFS_SECRET_KEY:-rustfsadmin}
      redis://redis:6379/1 vervedeck;
      exec juicefs mount redis://redis:6379/1 /mnt"
    volumes:
      - /data/juicefs:/mnt:rw,rshared
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    depends_on:
      rustfs:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "cat /mnt/.control >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [fintune]

  mineru:
    image: fintune/mineru:1.0
    build: ../images/mineru
    restart: unless-stopped
    volumes:
      - /data/uploads:/data/uploads
      - /data/hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [fintune]

  backend:
    image: fintune/backend:1.0
    build: ../platform/backend
    restart: unless-stopped
    environment:
      DB_URL: postgresql://fintune:${POSTGRES_PASSWORD:-fintune123}@postgres:5432/fintune
      DATA_DIR: /data
      DOCKER_NETWORK: fintune_net
      JWT_SECRET: ${JWT_SECRET:-vervedeck-dev-secret-change-me}
      # 安全加固（公网部署建议收紧）：CORS 白名单（逗号分隔来源）、关闭 API 文档
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      MINERU_URL: http://mineru:8000
      ARGILLA_URL: http://argilla:3000
      ARGILLA_API_KEY: ${ARGILLA_API_KEY:-fintune-argilla-key}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      INFER_PORT_BASE: "8100"
      # 推理引擎用官方开源镜像（CUDA 随镜像内置，不装宿主机）；
      # llamafactory 用 LLaMA-Factory 官方预构建镜像（hiyouga/llamafactory，免本地编译；
      # 离线/气隔环境可用 images/llama-factory 的自构 Dockerfile 兜底）
      # 评测引擎用官方开源 ModelScope 镜像（内置 evalscope，免本地编译；
      # 平台 runner.py 运行时由 backend 投递；离线/气隔环境可覆盖为 fintune/evalscope:1.0
      # 走 /repo 自构兜底——deploy/build-images.sh 中保留注释掉的构建行）
      IMAGES_TRAIN: hiyouga/llamafactory:0.9.5
      IMAGES_VLLM: vllm/vllm-openai:v0.33.0
      IMAGES_SGLANG: lmsysorg/sglang:v0.5.23
      IMAGES_EVAL: ${IMAGES_EVAL:-modelscope-registry.cn-hangzhou.cr.aliyuncs.com/modelscope-repo/modelscope:ubuntu22.04-cuda12.4.0-py311-torch2.6.0-1.26.0-LLM}
      # 对象存储：数据集版本主存储在 rustfs，/data/datasets 为处理缓存；
      # S3_ENDPOINT 留空则自动降级纯本地存储
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-vervedeck-datasets}
      # 宿主源码树（只读）：镜像管理页在线重建自构镜像的构建上下文
      VERVEDECK_REPO: /repo
      # 告警通知通道（DB「通知通道」页配置优先，此处为兜底；阈值告警由 Alertmanager 发出）
      WECOM_WEBHOOK: ${WECOM_WEBHOOK:-}            # 企业微信群机器人 webhook
      SMTP_HOST: ${SMTP_HOST:-}                    # 如 smtp.qq.com / smtp.exmail.qq.com
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}            # 邮箱授权码
      SMTP_FROM: ${SMTP_FROM:-}                    # 发件人（默认同 SMTP_USER）
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}          # 告警收件人，逗号分隔
      # 监控告警栈（指标底座 Prometheus；本服务渲染规则/通知配置到 /data/monitoring 并热加载）
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
    volumes:
      - /data:/data
      # JuiceFS 挂载点同路径 bind：容器 /data 的默认 rprivate bind 不传播宿主子挂载
      # （FUSE 挂载在容器内是空目录，已实测），须显式 bind 挂载点本身 backend 才可见；
      # 未挂载时 docker 自动建空目录，无副作用。worker 容器由 taskcontainer 动态补挂
      - /data/juicefs:/data/juicefs
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/vervedeck:/repo:ro
      # 宿主 IB/RDMA 设备（只读探测；backend 据此判断宿主有无 RDMA 并向任务容器注入
      # uverbs/rdma_cm 设备。无 RDMA 的宿主 docker 自动挂出空目录，无副作用）
      - /dev/infiniband:/dev/infiniband:ro
    ports:
      - "127.0.0.1:3001:3001"    # 仅本机：web（host 网络）经此转发 /api/ 与 /v1/
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_healthy
    networks:
      fintune:
        aliases:
          # 网关 DNS 服务源域名：Console 域名校验拒绝裸主机名与下划线标签，
          # backend 经此别名（<服务名>.local）注册为服务源，内置 DNS 解析到本容器
          - backend.local

  # 推理网关（Higress All-in-One）：模型路由的加权/容灾/重试数据面，控制面由 backend
  # 经 Console API（Basic Auth）同步。MODE=full = 网关(8080) + Console(8001) + 控制面同容器。
  # 数据面路径：客户端 → web(nginx) /v1/ → 127.0.0.1:8080 → 具体路由/兜底路由 → backend
  # （目标代理端口池 31xx 或主端口 3001）；路由域名均为通配（*），nginx 透传 Host 即可。
  # 控制台仅本机可访问（调试用）；backend 走 docker 网络服务名 higress 直连 8001。
  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:latest
    restart: unless-stopped
    environment:
      MODE: full
    ports:
      - "127.0.0.1:8080:8080"   # 网关 HTTP：web（host 网络）经此转发 /v1/；不暴露公网
      - "127.0.0.1:8001:8001"   # Console（控制面 API）仅本机调试
    volumes:
      - /data/higress:/data     # 网关状态持久化（路由/消费者等，重启不丢）
    networks: [fintune]

  web:
    image: fintune/web:1.0
    build: ../platform/frontend
    restart: unless-stopped
    # host 网络：nginx $remote_addr 为真实客户端 IP（登录 IP 白名单依赖；
    # bridge 端口映射下所有来源都呈现为 docker 网关 IP，白名单失效）
    # 后端经 127.0.0.1 端口映射访问（backend 3001 / argilla 3002 / grafana 3000）
    network_mode: host
    volumes:
      - ./tls:/etc/nginx/tls:ro
      # 网关限流动态配置（平台页面可配：系统管理→设置→网关限流）。backend 经
      # docker exec 写容器内该文件（= 落宿主此文件，web 重建不丢）；deploy.sh
      # 首启生成默认值——必须先于 compose up 存在，否则 docker 会建出空目录
      - ./nginx/00-zones.conf:/etc/nginx/conf.d/00-zones.conf
    depends_on:
      - backend

  # 节点心跳 Agent：GPU 指标已由 dcgm-exporter（Prometheus 链路）采集，本容器只负责
  # 节点在线判定（agent.ts 心跳）与 GPU 型号登记（agent.names），供平台节点表/离线事件使用
  gpu-agent:
    image: nvidia/dcgm:4.7.1-ubuntu24.04
    entrypoint: ["bash", "-lc"]
    command: ["exec bash /usr/local/bin/heartbeat.sh"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - /data/gpu:/data/gpu
      - ../images/gpu-agent/heartbeat.sh:/usr/local/bin/heartbeat.sh:ro
      # 宿主 IB 设备（只读）：heartbeat.sh 采集 ib_devices 写入节点 meta（RDMA 状态展示 + 任务容器注入回退）
      - /dev/infiniband:/dev/infiniband:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------- 监控告警栈：Prometheus + Grafana + Alertmanager（指标底座=DCGM+Linux 系统） ----------

  # DCGM GPU 指标导出器（NVIDIA 官方）：内嵌 hostengine，暴露 DCGM_FI_DEV_* 字段（温度/显存/功耗/时钟/降频…）
  # 字段集 = 镜像默认 + VerveDeck 扩展（6 个降频 VIOLATION + ECC 双/单位），见 monitoring/dcgm/counters.csv；
  # 目录挂载（非单文件）：改 CSV 后 exporter 自动热加载，且不受 bind mount inode 替换影响
  dcgm-exporter:
    image: nvidia/dcgm-exporter:4.6.1-4.8.4   # Docker Hub 官方镜像（nvcr.io 需 NGC 登录，改用 Hub）
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    command: ["--collectors", "/etc/dcgm-exporter/custom/counters.csv"]
    ports:
      # 默认仅本机；集群模式 deploy.sh 首启把 SCRAPE_BIND_IP 写入 .env（内网 IP），
      # 主节点 Prometheus 经内网 scrape 本节点 GPU 指标（不暴露公网，安全组勿开 9400）
      - "${SCRAPE_BIND_IP:-127.0.0.1}:9400:9400"
    volumes:
      - ./monitoring/dcgm:/etc/dcgm-exporter/custom:ro
    networks: [fintune]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Linux 宿主系统指标（node-exporter：CPU/内存/磁盘/网络/负载/系统信息）
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|tmp)($$|/)
      # 指标右尺寸化（2026-11-18 用户要求：4000+ series 太多，缩减到行业平均水平）：
      #  - netdev 流量计数器只保留真网卡（device-include）；/sys 接口状态指标的 veth 残留由 Prometheus 抓取侧 relabel 丢弃
      #  - 禁用按核/非必需采集器 softnet/schedstat/thermal_zone(含cooling)/pressure/hwmon（GPU 平台用不到）
      - "--collector.netdev.device-include=^(en|eth|nvidia|bond|wl|ib).*"
      - --no-collector.softnet
      - --no-collector.schedstat
      - --no-collector.thermal_zone
      - --no-collector.pressure
      - --no-collector.hwmon
    pid: host
    ports:
      # 同 dcgm-exporter：默认仅本机；集群模式主节点 Prometheus 经内网 scrape 本节点宿主指标
      - "${SCRAPE_BIND_IP:-127.0.0.1}:9100:9100"
    volumes:
      - /:/host:ro
    networks: [fintune]

  prometheus:
    image: prom/prometheus:v2.55.1   # 2.53 的 docker client 与 docker 29 daemon 发现不兼容（静默空 target），2.55 修复
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle   # POST /-/reload 热加载配置/规则（backend 渲染后调用）
    ports:
      - "127.0.0.1:9090:9090"    # 仅本机调试；UI 入口为 Grafana
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/monitoring/rules:/etc/prometheus/rules:ro   # 告警规则由 backend 从 UI 渲染写入
      - /data/monitoring/sd:/etc/prometheus/sd:ro         # 推理 target 由 backend 在部署 start/stop 时写入（file_sd）
      - /data/prometheus:/prometheus
    networks: [fintune]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/am
    volumes:
      - /data/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml  # backend 从「通知通道」渲染写入
      - /data/monitoring/am-data:/am
    networks: [fintune]

  grafana:
    image: grafana/grafana:11.6.2
    restart: unless-stopped
    environment:
      GF_PATHS_DATA: /data
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}   # 平台 iframe 嵌入免登录（只读 Viewer）；公网部署可设 GRAFANA_ANONYMOUS=false 关闭（监控大屏页将要求 Grafana 登录）
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_SIGNUP: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"         # 允许平台 iframe 嵌入；缺省为 false 时 Grafana 返回 X-Frame-Options: DENY，浏览器拒绝展示（即使同源）
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-https://127.0.0.1/grafana/}"    # 缺省时 Grafana 按 Host+监听端口(3000)生成 <base>，该端口仅本机可访问 → 静态资源全 404（"failed to load application files"）；设为含子路径的绝对 URL 后 <base> 为 /grafana/，资源经 nginx 前缀代理正常（已验证 2026-11-15）
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-vervedeck-grafana}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"    # 仅本机调试；平台内走 web 容器 /grafana 反向代理
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /data/grafana:/data
    networks: [fintune]

  # Grafana 浅色实例：匿名默认主题固定（11.6 镜像 default_theme=dark）且匿名 API 不允许改偏好（401），
  # 平台浅色模式的大屏嵌入改指向本实例（default_theme=light）实现主题跟随；
  # 数据卷独立（两实例共用同一 SQLite 有竞争风险），数据源/仪表盘走同一 provisioning
  grafana-light:
    image: grafana/grafana:11.6.2
    restart: unless-stopped
    environment:
      GF_PATHS_DATA: /data
      GF_USERS_DEFAULT_THEME: "light"
      GF_AUTH_ANONYMOUS_ENABLED: "true"           # 平台 iframe 嵌入免登录（只读 Viewer）
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_SIGNUP: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"         # 允许平台 iframe 嵌入（缺省 false → X-Frame-Options: DENY）
      GF_SERVER_ROOT_URL: "${GRAFANA_LIGHT_ROOT_URL:-https://127.0.0.1/grafana-light/}"    # 含子路径绝对 URL → <base href="/grafana-light/">，资源经 nginx 前缀代理
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-vervedeck-grafana}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3003:3000"    # 仅本机调试；平台内走 web 容器 /grafana-light 反向代理
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /data/grafana-light:/data
    networks: [fintune]

networks:
  fintune:
    name: fintune_net

volumes:
  rustfs-data:
