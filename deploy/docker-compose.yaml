# VerveDeck 大模型微调训练平台 - 容器编排
# 数据根目录: /data (models/datasets/jobs/gpu/argilla/postgres/redis/uploads)
name: fintune

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintune
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintune123}
      POSTGRES_DB: fintune
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintune"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [fintune]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /data/redis:/data
    networks: [fintune]

  # argilla 2.x 强制要求搜索引擎，单节点 opensearch 关闭安全插件
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - /data/opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [fintune]

  argilla:
    image: fintune/argilla:1.0
    build: ../images/argilla
    restart: unless-stopped
    # argilla-server 2.8.0: 数据库由 ARGILLA_ 前缀环境变量配置；
    # 启动前跑迁移并预建服务账号（2.x 改为 DB 级 API key 认证）
    command: >
      bash -c "python -m argilla_server database migrate &&
      (python -m argilla_server database users create
      --username fintune --first-name Fintune --last-name Service
      --role admin --password fintune123456
      --api-key ${ARGILLA_API_KEY:-fintune-argilla-key} --workspace argilla || true) &&
      python -m argilla_server start --host 0.0.0.0 --port 3000"
    # argilla 2.x settings 带 env_prefix=ARGILLA_，环境变量必须加前缀
    environment:
      ARGILLA_API_KEY: ${ARGILLA_API_KEY:-fintune-argilla-key}
      ARGILLA_DATABASE_URL: sqlite+aiosqlite:////data/argilla/argilla.db?check_same_thread=False
      ARGILLA_SEARCH_ENGINE: opensearch
      ARGILLA_ELASTICSEARCH: http://opensearch:9200
      ARGILLA_ELASTICSEARCH_SSL_VERIFY: "false"
      ARGILLA_REDIS_URL: redis://redis:6379
    volumes:
      - /data/argilla:/data/argilla
    depends_on:
      opensearch:
        condition: service_healthy
    networks: [fintune]

  # ---- 对象存储（rustfs，S3 兼容）：数据集版本文件的主存储 ----
  # 非 root 用户（UID 10001），数据目录须用命名卷；S3 API :9000 + 管理控制台 :9001
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3 API（宿主机 mc/客户端；backend 走内网 rustfs:9000）
      - "9001:9001"   # Web 管理控制台
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [fintune]

  mineru:
    image: fintune/mineru:1.0
    build: ../images/mineru
    restart: unless-stopped
    volumes:
      - /data/uploads:/data/uploads
      - /data/hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [fintune]

  backend:
    image: fintune/backend:1.0
    build: ../platform/backend
    restart: unless-stopped
    environment:
      DB_URL: postgresql://fintune:${POSTGRES_PASSWORD:-fintune123}@postgres:5432/fintune
      DATA_DIR: /data
      DOCKER_NETWORK: fintune_net
      JWT_SECRET: ${JWT_SECRET:-vervedeck-dev-secret-change-me}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      MINERU_URL: http://mineru:8000
      ARGILLA_URL: http://argilla:3000
      ARGILLA_API_KEY: ${ARGILLA_API_KEY:-fintune-argilla-key}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      INFER_PORT_BASE: "8100"
      IMAGES_TRAIN: fintune/llama-factory:1.0
      IMAGES_VLLM: fintune/vllm:1.0
      IMAGES_SGLANG: fintune/sglang:1.0
      IMAGES_EVAL: fintune/evalscope:1.0
      # 对象存储：数据集版本主存储在 rustfs，/data/datasets 为处理缓存；
      # S3_ENDPOINT 留空则自动降级纯本地存储
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-vervedeck-datasets}
    volumes:
      - /data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_healthy
    networks: [fintune]

  web:
    image: fintune/web:1.0
    build: ../platform/frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [fintune]

  gpu-agent:
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
    restart: unless-stopped
    command: >
      bash -c "while true; do nvidia-smi --query-gpu=index,name,memory.used,memory.total,utilization.gpu,power.draw,temperature.gpu
      --format=csv,header,nounits > /data/gpu/agent.csv && date +%s > /data/gpu/agent.ts; sleep 5; done"
    volumes:
      - /data/gpu:/data/gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [fintune]

networks:
  fintune:
    name: fintune_net

volumes:
  rustfs-data:
