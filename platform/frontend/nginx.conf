# HTTP 一律 301 到 HTTPS（容器内 80 仅兜底，宿主机只暴露 443）
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/tls/vervedeck.crt;
    ssl_certificate_key /etc/nginx/tls/vervedeck.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 强制 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 200m;

    # web 容器为 host 网络：上游经宿主 127.0.0.1 端口映射访问（地址固定，免 DNS）；
    # $remote_addr 为真实客户端 IP（登录 IP 白名单依赖 X-Real-IP）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001;
    }

    location /argilla/ {
        rewrite ^/argilla/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }

    # Grafana 监控大屏（匿名只读，供监控大屏页 iframe 嵌入；同源 HTTPS 避免混合内容拦截）
    location /grafana/ {
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
