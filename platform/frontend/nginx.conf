# HTTP 一律 301 到 HTTPS（容器内 80 仅兜底，宿主机只暴露 443）
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/tls/vervedeck.crt;
    ssl_certificate_key /etc/nginx/tls/vervedeck.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 强制 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 200m;

    # 用 Docker 内置 DNS 逐请求解析服务名，避免容器重建后 nginx 缓存旧 IP 导致 502
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /v1/ {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    location /health {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
    }

    location /argilla/ {
        set $argilla_upstream http://argilla:3000;
        rewrite ^/argilla/(.*)$ /$1 break;
        proxy_pass $argilla_upstream;
        proxy_set_header Host $host;
    }

    # Grafana 监控大屏（匿名只读，供监控大屏页 iframe 嵌入；同源 HTTPS 避免混合内容拦截）
    location /grafana/ {
        set $grafana_upstream http://grafana:3000;
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
