# HTTP 一律 301 到 HTTPS（容器内 80 仅兜底，宿主机只暴露 443）
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;                 # 隐藏 nginx 版本（防针对性漏洞扫描）
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/tls/vervedeck.crt;
    ssl_certificate_key /etc/nginx/tls/vervedeck.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ---- 安全响应头（always：4xx/5xx 也携带）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # 强制 HTTPS
    add_header X-Content-Type-Options "nosniff" always;           # 防 MIME 嗅探
    add_header X-Frame-Options "DENY" always;                     # 平台页禁止被第三方 iframe 嵌入
    add_header Referrer-Policy "same-origin" always;              # 防 Referer 泄露 URL 细节

    client_max_body_size 200m;

    # ---- 限流（zone 定义见 00-zones.conf；429 而非默认 503，语义更准）----
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn conn_limit 50;     # 单 IP 并发连接上限

    # web 容器为 host 网络：上游经宿主 127.0.0.1 端口映射访问（地址固定，免 DNS）；
    # $remote_addr 为真实客户端 IP（登录 IP 白名单依赖 X-Real-IP）

    # 登录接口：最严格限流（防暴力破解第一道闸，应用层还有失败锁定+告警）
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /v1/ {
        limit_req zone=v1_limit burst=120 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001;
    }

    location /argilla/ {
        rewrite ^/argilla/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }

    # Grafana 监控大屏（匿名只读，供监控大屏页 iframe 嵌入；同源 HTTPS 避免混合内容拦截）
    location /grafana/ {
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Grafana 浅色实例（匿名默认主题=light）：平台浅色模式的大屏嵌入改走此入口，主题与页面一致
    location /grafana-light/ {
        rewrite ^/grafana-light/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
