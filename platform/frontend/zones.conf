# 网关限流 zone（http 级定义，conf.d 文件在 http 上下文内被 include）
# web 容器为 host 网络：$binary_remote_addr 即真实客户端 IP
#
# ★ 本文件由平台动态管理：系统管理→设置→网关限流 保存时 backend 重新渲染并
#   热加载（nginx -t 校验 + reload，失败回滚）。部署时 compose 将宿主
#   deploy/nginx/00-zones.conf 绑定挂载到此处（deploy.sh 首启生成默认值）；
#   勿手改，手改会被下一次保存覆盖。
#
# 防暴力破解分层：
#   1) 本层（网关）：按 IP 限请求速率——登录 5r/s，超限直接 429，攻击流量到不了应用层
#      （bcrypt 校验慢，应用层每个失败请求都耗 CPU，网关必须先挡量）
#   2) 应用层（backend /api/auth/login）：账号 5 次 / IP 30 次失败双维度锁定 15 分钟
#      + IP 白名单 + 锁定告警（见 系统管理→设置）
#   burst 缓冲固定在 default.conf（登录 5 / API 60 / v1 120），此处只改速率基线

# 登录接口：严格。5r/s + burst 5（nodelay 超限立即 429，不排队）
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

# 平台 API 总体：中等。拦高频扫描/爬取，正常用户操作远低于此
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# OpenAI 兼容代理（/v1/）：推理请求合法高频（agent 循环/流式），放宽
limit_req_zone $binary_remote_addr zone=v1_limit:10m rate=60r/s;

# 单 IP 并发连接数（防连接耗尽型慢速攻击）：zone 定义 + 生效值同文件，
# 页面调整 conn_limit 时整文件重渲染
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_conn conn_limit 50;
