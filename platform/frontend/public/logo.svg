<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="vdg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4096ff"/>
      <stop offset="1" stop-color="#0958d9"/>
    </linearGradient>
  </defs>
  <!-- 后方浅蓝卡片：呼应 Deck（卡组）意象 -->
  <rect x="9" y="11" width="49" height="49" rx="13" fill="#bae0ff"/>
  <!-- 前方：猫头剪影（渐变填充，双耳 + 圆脸），替代原 VD 字母卡 -->
  <path fill="url(#vdg)" d="
    M11 33
    C11 25 13.5 19.5 18 16.5
    L26.5 22.5
    C28.3 21.3 30.1 20.7 32 20.7
    C33.9 20.7 35.7 21.3 37.5 22.5
    L46 16.5
    C50.5 19.5 53 25 53 33
    C53 43.5 44 50 32 50
    C20 50 11 43.5 11 33 Z"/>
  <!-- 眼睛（挖出背景蓝） -->
  <g fill="#eaf3ff">
    <circle cx="24.5" cy="33" r="2.9"/>
    <circle cx="39.5" cy="33" r="2.9"/>
  </g>
  <!-- 瞳孔 -->
  <g fill="url(#vdg)">
    <circle cx="24.5" cy="33" r="1.3"/>
    <circle cx="39.5" cy="33" r="1.3"/>
  </g>
  <!-- 鼻子 -->
  <path d="M32 38.6 L29.9 36.4 L34.1 36.4 Z" fill="#eaf3ff"/>
  <!-- 嘴 -->
  <path d="M32 38.6 C32 40.4 30.4 41.4 28.9 41 M32 38.6 C32 40.4 33.6 41.4 35.1 41"
        fill="none" stroke="#eaf3ff" stroke-width="1.1" stroke-linecap="round"/>
  <!-- 胡须 -->
  <g stroke="#eaf3ff" stroke-width="1.15" stroke-linecap="round">
    <path d="M16.5 36.5 L23 37.6"/>
    <path d="M16.5 40.5 L23 39.4"/>
    <path d="M47.5 36.5 L41 37.6"/>
    <path d="M47.5 40.5 L41 39.4"/>
  </g>
</svg>
